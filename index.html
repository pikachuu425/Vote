<style>
:root{--bg:#f7f5f0;--card:#fffdfa;--ink:#2e3934;--muted:#8b918e;--green:#719681;--pale:#e6eee8;--line:#e8e4dd;--danger:#b96f68}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}button,input,textarea{font:inherit}
.shell{max-width:1180px;margin:auto;padding:28px 24px 64px}.nav{display:flex;justify-content:flex-end;gap:12px}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;background:#ece9e3;color:var(--ink)}.btn.primary{background:var(--green);color:white}.btn.danger{background:#f6e9e7;color:var(--danger)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;margin:58px 0 56px}.badge{display:inline-block;background:var(--pale);color:#4d735f;border-radius:999px;padding:8px 14px;font-weight:800}.hero h1{font-size:clamp(46px,5.5vw,74px);line-height:1.15;letter-spacing:-.045em;margin:22px 0}.village{height:310px;border-radius:38px;position:relative;overflow:hidden;background:linear-gradient(#f8f1e7 0 45%,#dfe7dc 45% 100%)}
.sun{position:absolute;width:50px;height:50px;border-radius:50%;background:#f2cf92;top:52px;left:48%}.hill{position:absolute;width:380px;height:190px;border-radius:50% 50% 0 0;background:#bdccbd;bottom:35px}.hill.h2{right:-90px;background:#d2dacd;height:150px}.house{position:absolute;bottom:42px;width:90px;height:65px;background:#fff8eb;border-radius:4px}.house:before{content:"";position:absolute;left:-8px;top:-34px;border-left:53px solid transparent;border-right:53px solid transparent;border-bottom:38px solid #e9c09f}.house.a{left:110px}.house.b{left:220px;transform:scale(.8)}.tree{position:absolute;right:30px;bottom:35px;width:18px;height:100px;background:#9d8978}.tree:before{content:"";position:absolute;width:110px;height:85px;border-radius:50%;background:#879f86;left:-65px;top:-45px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 16px 45px rgba(60,70,64,.07)}.view{display:none}.view.active{display:block}.pollrow{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}.pollrow:last-child{border-bottom:0}.meta{color:var(--muted);font-size:14px;margin-top:6px}.actions{display:flex;gap:8px;flex-wrap:wrap}
label{display:block;font-weight:800;margin:16px 0 8px}input[type=text],textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fbfaf7;outline:none}textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.toggle{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:16px 0}.switch{width:48px;height:28px;background:#d5d5d0;border:0;border-radius:30px;padding:3px}.switch:after{content:"";display:block;width:22px;height:22px;background:white;border-radius:50%;transition:.2s}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(20px)}.optionrow{display:flex;gap:8px;margin:9px 0}.optionrow input{flex:1}.voteopt{padding:15px;border:1px solid var(--line);border-radius:16px;margin:10px 0;cursor:pointer}.voteopt.selected{border-color:var(--green);background:#edf3ef}.bar{height:10px;background:#ecebe7;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--green)}.result{margin:18px 0}.between{display:flex;justify-content:space-between;gap:15px}.share{display:flex;gap:8px;margin-top:20px}.share input{flex:1}.notice{padding:12px 15px;background:#fff4db;border-radius:12px;margin:15px 0;color:#765f31}.hidden{display:none!important}
.village{background:none!important;overflow:hidden}.village img{width:100%;height:100%;object-fit:cover;display:block;border-radius:38px}.village .sun,.village .hill,.village .house,.village .tree{display:none!important}@media(max-width:760px){.hero,.grid{grid-template-columns:1fr}.hero{gap:26px;margin-top:35px}.hero h1{font-size:44px}.village{height:230px}.pollrow{align-items:flex-start;flex-direction:column}}
</style>

<div class="card"><h2>你的投票</h2><div id="pollList">載入中…</div></div>
</section>

<section id="create" class="view"><div class="card"><h1>建立新投票</h1>
<label>投票主題</label><input id="title" type="text" placeholder="例如：AI 候選人">
<label>補充說明（選填）</label><textarea id="desc"></textarea>
<div class="grid"><div>
<div class="toggle"><div><b>匿名投票</b><div class="meta">結果不顯示投票者姓名</div></div><button id="anon" class="switch on" onclick="toggle(this)"></button></div>
<div class="toggle"><div><b>允許自行輸入選項</b><div class="meta">參與者可提出其他答案</div></div><button id="custom" class="switch" onclick="toggle(this)"></button></div>
</div><div><label>投票選項</label><div id="options"></div><button class="btn" onclick="addOption()">＋ 新增選項</button></div></div>
<div class="actions" style="justify-content:flex-end;margin-top:24px"><button class="btn" onclick="goHome()">取消</button><button class="btn primary" onclick="createPoll()">建立並取得連結</button></div>
</div></section>

<section id="vote" class="view"><div class="card">
<div class="between"><div><span id="voteBadge" class="badge"></span><h1 id="voteTitle"></h1><p id="voteDesc" class="meta"></p></div><button class="btn" onclick="goHome()">← 返回</button></div>
<div id="voterName" class="hidden"><label>你的名字</label><input id="nameInput" type="text" placeholder="請輸入姓名"></div>
<div id="voteOptions"></div>
<div id="customWrap" class="hidden"><label>其他想法</label><input id="customInput" type="text" placeholder="輸入你的選項"></div>
<div id="already" class="notice hidden">這個瀏覽器身分已投過這個投票。</div>
<div class="actions" style="justify-content:flex-end;margin-top:22px"><button class="btn" onclick="showResults()">查看結果</button><button id="voteBtn" class="btn primary" onclick="submitVote()">送出我的選擇</button></div>
<div class="share"><input id="shareLink" type="text" readonly><button class="btn" onclick="copyLink()">複製連結</button></div>
</div></section>

<section id="results" class="view"><div class="card"><span class="badge">投票結果</span><h1 id="resultTitle"></h1><p id="resultCount" class="meta"></p><div id="resultBars"></div><div class="actions" style="justify-content:flex-end"><button class="btn" onclick="show('vote')">返回投票</button><button class="btn primary" onclick="goHome()">完成</button></div></div></section>
</main>

<script>
// ===== 只需要把 Firebase 提供的設定貼在這裡 =====
const firebaseConfig = {
  apiKey: "AIzaSyCcJ28Fkwu0LTWZq7g0B8Y0NAAr-GAjs4M",
  authDomain: "vote-bd59c.firebaseapp.com",
  projectId: "vote-bd59c",
  storageBucket: "vote-bd59c.firebasestorage.app",
  messagingSenderId: "999644776434",
  appId: "1:999644776434:web:37eb32730c758133c74d6b"
};
// ===============================================

const configured = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");
if (configured) firebase.initializeApp(firebaseConfig);
const db = configured ? firebase.firestore() : null;

let current=null, selected=null;
const polls = () => db.collection("polls");

function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function toggle(el){el.classList.toggle('on')}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function addOption(v=''){let r=document.createElement('div');r.className='optionrow';r.innerHTML=`<input type="text" value="${esc(v)}" placeholder="輸入選項"><button class="btn" onclick="this.parentElement.remove()">×</button>`;document.getElementById('options').appendChild(r)}
function fail(e){console.error(e);alert(e?.message||String(e))}
function adminName(id){return "village_admin_"+id}
function makeKey(){return crypto.randomUUID ? crypto.randomUUID()+crypto.randomUUID() : Date.now()+Math.random().toString(36)}

async function init(){
 addOption();addOption();
 if(!configured){
   pollList.innerHTML='<div class="notice">尚未填入 Firebase 設定。請依 README 的步驟把 firebaseConfig 貼進 index.html。</div>';
   return;
 }
 await route();
}
async function route(){
 let m=location.hash.match(/^#poll=([^&]+)$/);
 if(m) return openPoll(m[1]);
 await loadMine(); show('home');
}
async function goHome(){history.replaceState(null,'',location.pathname+location.search);await loadMine();show('home')}

async function loadMine(){
 let ids=Object.keys(localStorage).filter(k=>k.startsWith("village_admin_")).map(k=>k.replace("village_admin_",""));
 if(!ids.length){pollList.innerHTML='<div class="meta">目前還沒有你在這台瀏覽器建立的投票。建立一個試試看吧。</div>';return}
 let docs=[];
 for(const id of ids){let snap=await polls().doc(id).get();if(snap.exists)docs.push({id:snap.id,...snap.data()})}
 docs.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 pollList.innerHTML=docs.length?docs.map(p=>`<div class="pollrow"><div><b>${esc(p.title)}</b><div class="meta">${p.anonymous?'匿名':'記名'}投票 · ${(p.votes||[]).length} 票</div></div><div class="actions"><button class="btn" onclick="openPoll('${p.id}')">進入投票 →</button><button class="btn danger" onclick="deletePoll('${p.id}','${esc(p.title)}')">刪除</button></div></div>`).join(''):'<div class="meta">目前還沒有投票。</div>';
}

async function createPoll(){
 const titleEl=document.getElementById('title');
 const descEl=document.getElementById('desc');
 const optionsEl=document.getElementById('options');
 const anonEl=document.getElementById('anon');
 const customEl=document.getElementById('custom');
 const btn=document.querySelector('#create .btn.primary');
 try{
   if(!db) throw new Error('Firebase 尚未正確連線。');
   const t=titleEl.value.trim();
   const vals=[...optionsEl.querySelectorAll('input')].map(x=>x.value.trim()).filter(Boolean);
   if(!t){alert('請輸入投票主題');return}
   if(vals.length<2){alert('請至少輸入兩個選項');return}
   if(btn){btn.disabled=true;btn.textContent='建立中…'}
   const key=makeKey();
   const ref=await polls().add({
     title:t,
     description:descEl.value.trim(),
     anonymous:anonEl.classList.contains('on'),
     allowCustom:customEl.classList.contains('on'),
     options:vals.map((text,i)=>({id:"o"+Date.now()+i+Math.random().toString(36).slice(2),text})),
     votes:[],
     adminKey:key,
     createdAt:Date.now()
   });
   localStorage.setItem(adminName(ref.id),key);
   location.hash="poll="+ref.id;
   await openPoll(ref.id);
 }catch(e){
   console.error('Create poll failed:',e);
   alert('建立投票失敗：'+(e?.message||e)+'\n\n請把這段錯誤訊息截圖給我。');
 }finally{
   if(btn){btn.disabled=false;btn.textContent='建立並取得連結'}
 }
}

async function openPoll(id){
 let snap=await polls().doc(id).get();
 if(!snap.exists)return alert('找不到這個投票');
 let p={id:snap.id,...snap.data()};current=p;selected=null;
 voteTitle.textContent=p.title;
 voteDesc.textContent=p.description||'選出最符合你想法的一項。';
 voteBadge.textContent=p.anonymous?'匿名投票':'記名投票';
 voterName.classList.toggle('hidden',p.anonymous);
 customWrap.classList.toggle('hidden',!p.allowCustom);
 voteOptions.innerHTML=(p.options||[]).map(o=>`<div class="voteopt" data-id="${o.id}" onclick="pick(this)">${esc(o.text)}</div>`).join('');
 shareLink.value=location.href.split('#')[0]+"#poll="+id;
 history.replaceState(null,'',"#poll="+id);
 already.classList.add('hidden');voteBtn.disabled=false;show('vote');
}
function pick(el){document.querySelectorAll('.voteopt').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selected=el.dataset.id}

async function submitVote(){
 if(!current.anonymous&&!nameInput.value.trim())return alert('請輸入你的名字');
 let customText=customInput.value.trim();
 if(!selected&&!customText)return alert('請選擇一個選項');
 let ref=polls().doc(current.id);
 try{
   await db.runTransaction(async tx=>{
     let snap=await tx.get(ref);if(!snap.exists)throw new Error("投票不存在");
     let p=snap.data(), opts=p.options||[], oid=selected;
     if(customText){
       if(!p.allowCustom)throw new Error("此投票不允許自行新增選項");
       let existing=opts.find(o=>o.text.toLowerCase()===customText.toLowerCase());
       if(existing)oid=existing.id;
       else{oid="o"+Date.now()+Math.random().toString(36).slice(2);opts.push({id:oid,text:customText.slice(0,200)})}
     }
     let votes=p.votes||[];
     votes.push({optionId:oid,name:p.anonymous?null:nameInput.value.trim().slice(0,100),at:Date.now()});
     tx.update(ref,{options:opts,votes});
   });
   customInput.value='';nameInput.value='';await openPoll(current.id);await showResults();
 }catch(e){fail(e)}
}

async function showResults(){
 let snap=await polls().doc(current.id).get();if(!snap.exists)return alert('投票不存在');
 current={id:snap.id,...snap.data()};
 let votes=current.votes||[], total=votes.length;
 resultTitle.textContent=current.title;resultCount.textContent=`目前共收到 ${total} 票`;
 resultBars.innerHTML=(current.options||[]).map(o=>{
   let n=votes.filter(v=>v.optionId===o.id).length,pct=total?Math.round(n/total*100):0;
   return `<div class="result"><div class="between"><b>${esc(o.text)}</b><span>${n} 票 · ${pct}%</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>`;
 }).join('');
 show('results');
}

async function deletePoll(id,t){
 let key=localStorage.getItem(adminName(id));
 if(!key)return alert('這台瀏覽器沒有此投票的管理權限。');
 if(!confirm(`確定要刪除「${t}」嗎？`))return;
 let ref=polls().doc(id),snap=await ref.get();
 if(!snap.exists)return loadMine();
 if(snap.data().adminKey!==key)return alert('管理密鑰不正確。');
 await ref.delete();localStorage.removeItem(adminName(id));await loadMine();
}
function copyLink(){navigator.clipboard.writeText(shareLink.value).then(()=>alert('投票連結已複製')).catch(()=>prompt('請複製以下網址',shareLink.value))}
window.addEventListener('hashchange',route);init();
</script></body></html>
